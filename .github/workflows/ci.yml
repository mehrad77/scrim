name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Bundle budgets
        run: pnpm --filter @scrim/web budget

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @scrim/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Relay load test (200 phones)
        run: |
          pnpm dev:relay &
          npx wait-on -t 60000 http://localhost:8790/health
          pnpm loadtest -- --phones 200 --rounds 2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results

  deploy:
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cloudflare access token
        env:
          CLOUDFLARE_OAUTH_REFRESH_TOKEN: ${{ secrets.CLOUDFLARE_OAUTH_REFRESH_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const res = await fetch('https://dash.cloudflare.com/oauth2/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
              grant_type: 'refresh_token',
              refresh_token: process.env.CLOUDFLARE_OAUTH_REFRESH_TOKEN,
              client_id: '54d11594-84e4-41aa-b438-e81b8fa78ee7',
            }),
          });
          if (!res.ok) {
            console.error(`Cloudflare token refresh failed: ${res.status}`);
            process.exit(1);
          }
          const { access_token } = await res.json();
          console.log(`::add-mask::${access_token}`);
          appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_API_TOKEN<<EOF\n${access_token}\nEOF\n`);
          JS
      - name: Deploy relay
        run: pnpm --filter @scrim/relay run deploy
      - name: Deploy app
        run: pnpm --filter @scrim/web run deploy
      - name: Probe
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors https://scrim.shab.boo -o /dev/null
          test "$(curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors https://relay.scrim.shab.boo/health)" = ok
