name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Bundle budgets
        run: pnpm --filter @scrim/web budget

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @scrim/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Relay load test (200 phones)
        run: |
          pnpm dev:relay &
          npx wait-on -t 60000 http://localhost:8790/health
          pnpm loadtest -- --phones 200 --rounds 2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results

  deploy:
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy relay
        run: pnpm --filter @scrim/relay deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy app
        run: pnpm --filter @scrim/web deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Probe
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors https://scrim.shab.boo -o /dev/null
          test "$(curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors https://relay.scrim.shab.boo/health)" = ok
